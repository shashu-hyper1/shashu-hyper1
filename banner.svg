<svg width="900" height="220" viewBox="0 0 900 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="900" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#0f1b2d"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#70a5fd"/>
      <stop offset="50%" stop-color="#bf91f3"/>
      <stop offset="100%" stop-color="#38bdae"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#70a5fd" stop-opacity="0"/>
      <stop offset="30%" stop-color="#70a5fd" stop-opacity="0.22"/>
      <stop offset="70%" stop-color="#bf91f3" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#70a5fd" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#bf91f3" stop-opacity="0"/>
      <stop offset="40%" stop-color="#bf91f3" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#38bdae" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#bf91f3" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdae" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38bdae" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38bdae" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="w4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#70a5fd" stop-opacity="0"/>
      <stop offset="60%" stop-color="#70a5fd" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#70a5fd" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)"/>

  <!-- Top accent line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#nameGrad)" opacity="0.7"/>

  <!-- Twinkling stars -->
  <circle cx="40"  cy="22" r="1.3" fill="#c8d3ff"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="130" cy="45" r="1.0" fill="#c8d3ff"><animate attributeName="opacity" values="0.3;0.8;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="28" r="1.4" fill="#c8d3ff"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="860" cy="50" r="1.1" fill="#c8d3ff"><animate attributeName="opacity" values="0.2;0.7;0.2" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="50"  cy="155" r="1.2" fill="#c8d3ff"><animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.0s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="150" r="1.0" fill="#c8d3ff"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="200" cy="165" r="1.3" fill="#c8d3ff"><animate attributeName="opacity" values="0.3;0.7;0.3" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="700" cy="162" r="1.1" fill="#c8d3ff"><animate attributeName="opacity" values="0.4;0.85;0.4" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="380" cy="18"  r="1.2" fill="#c8d3ff"><animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="530" cy="35"  r="1.0" fill="#c8d3ff"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="4.5s" repeatCount="indefinite"/></circle>

  <!-- Wave 1 -->
  <path fill="url(#w1)">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="
        M0,220 C0,142 60,128 120,134 C180,140 230,118 290,124 C350,130 390,112 450,120 C510,128 560,114 620,122 C680,130 730,116 790,124 C840,130 880,120 900,124 L900,220 Z;
        M0,220 C0,132 60,118 120,126 C180,134 230,148 290,140 C350,132 390,124 450,130 C510,136 560,122 620,128 C680,134 730,122 790,130 C840,136 880,126 900,130 L900,220 Z;
        M0,220 C0,142 60,128 120,134 C180,140 230,118 290,124 C350,130 390,112 450,120 C510,128 560,114 620,122 C680,130 730,116 790,124 C840,130 880,120 900,124 L900,220 Z
      "/>
  </path>

  <!-- Wave 2 -->
  <path fill="url(#w2)">
    <animate attributeName="d" dur="12s" repeatCount="indefinite"
      values="
        M0,220 C0,158 60,148 130,154 C200,160 250,144 320,150 C390,156 420,140 480,148 C540,156 590,142 660,150 C730,158 790,146 860,152 C880,154 895,150 900,152 L900,220 Z;
        M0,220 C0,168 60,156 130,162 C200,168 250,154 320,160 C390,166 420,152 480,158 C540,164 590,150 660,158 C730,166 790,154 860,160 C880,162 895,158 900,160 L900,220 Z;
        M0,220 C0,158 60,148 130,154 C200,160 250,144 320,150 C390,156 420,140 480,148 C540,156 590,142 660,150 C730,158 790,146 860,152 C880,154 895,150 900,152 L900,220 Z
      "/>
  </path>

  <!-- Wave 3 -->
  <path fill="url(#w3)">
    <animate attributeName="d" dur="15s" repeatCount="indefinite"
      values="
        M0,220 C0,174 80,166 160,170 C240,174 280,164 360,168 C440,172 480,162 560,166 C640,170 700,162 780,168 C840,172 880,166 900,168 L900,220 Z;
        M0,220 C0,182 80,172 160,176 C240,180 280,170 360,174 C440,178 480,168 560,172 C640,176 700,168 780,174 C840,178 880,172 900,174 L900,220 Z;
        M0,220 C0,174 80,166 160,170 C240,174 280,164 360,168 C440,172 480,162 560,166 C640,170 700,162 780,168 C840,172 880,166 900,168 L900,220 Z
      "/>
  </path>

  <!-- Wave 4 -->
  <path fill="url(#w4)">
    <animate attributeName="d" dur="18s" repeatCount="indefinite"
      values="
        M0,220 C0,190 100,184 200,188 C300,192 360,184 460,188 C560,192 620,184 720,188 C820,192 870,186 900,188 L900,220 Z;
        M0,220 C0,196 100,190 200,194 C300,198 360,190 460,194 C560,198 620,190 720,194 C820,198 870,192 900,194 L900,220 Z;
        M0,220 C0,190 100,184 200,188 C300,192 360,184 460,188 C560,192 620,184 720,188 C820,192 870,186 900,188 L900,220 Z
      "/>
  </path>

  <!-- Glow orbs behind name -->
  <ellipse cx="300" cy="90" rx="160" ry="60" fill="#70a5fd" opacity="0.04"/>
  <ellipse cx="600" cy="90" rx="160" ry="60" fill="#bf91f3" opacity="0.04"/>

  <!-- Left { right } decorations -->
  <text x="58" y="108" font-family="'Fira Code',monospace" font-size="48" fill="#70a5fd" opacity="0.18">{</text>
  <text x="822" y="108" font-family="'Fira Code',monospace" font-size="48" fill="#38bdae" opacity="0.18">}</text>

  <!-- MAIN NAME -->
  <text x="450" y="95" text-anchor="middle"
    font-family="'Fira Code', Consolas, monospace"
    font-size="52" font-weight="700" letter-spacing="4"
    fill="url(#nameGrad)" filter="url(#glow)">
    Sai Shashank M
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.1;0.35" dur="2.5s" fill="freeze"/>
  </text>

  <!-- Underline that draws itself -->
  <rect x="450" y="103" width="0" height="1.5" rx="1" fill="url(#nameGrad)" opacity="0.5">
    <animate attributeName="width" values="0;340" dur="1.2s" begin="0.6s" fill="freeze"/>
    <animate attributeName="x" values="450;280" dur="1.2s" begin="0.6s" fill="freeze"/>
  </rect>

  <!-- Tagline -->
  <text x="450" y="128" text-anchor="middle"
    font-family="'Fira Code', Consolas, monospace"
    font-size="11.5" letter-spacing="3.5" fill="#8b949e" opacity="0">
    UAV ENGINEER  ·  EMBEDDED SYSTEMS  ·  AI  ·  FULL-STACK
    <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.45;0.7" dur="3.5s" fill="freeze"/>
  </text>

  <!-- Bottom accent line -->
  <rect x="0" y="218" width="900" height="2" fill="url(#nameGrad)" opacity="0.7"/>
</svg>
