<svg width="100%" viewBox="0 0 900 240" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sai Shashank M - Hero Banner</title>
<desc>UAV Engineer, Embedded Systems, AI and Full-Stack developer banner</desc>

<defs>
  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%"   stop-color="#0d1117"/>
    <stop offset="40%"  stop-color="#0f1b2d"/>
    <stop offset="100%" stop-color="#0d1117"/>
  </linearGradient>

  <linearGradient id="wave1g" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#70a5fd" stop-opacity="0.0"/>
    <stop offset="30%"  stop-color="#70a5fd" stop-opacity="0.22"/>
    <stop offset="70%"  stop-color="#bf91f3" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#70a5fd" stop-opacity="0.0"/>
  </linearGradient>
  <linearGradient id="wave2g" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#bf91f3" stop-opacity="0.0"/>
    <stop offset="40%"  stop-color="#bf91f3" stop-opacity="0.18"/>
    <stop offset="80%"  stop-color="#38bdae" stop-opacity="0.15"/>
    <stop offset="100%" stop-color="#bf91f3" stop-opacity="0.0"/>
  </linearGradient>
  <linearGradient id="wave3g" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#38bdae" stop-opacity="0.0"/>
    <stop offset="50%"  stop-color="#38bdae" stop-opacity="0.18"/>
    <stop offset="100%" stop-color="#38bdae" stop-opacity="0.0"/>
  </linearGradient>
  <linearGradient id="wave4g" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#70a5fd" stop-opacity="0.0"/>
    <stop offset="60%"  stop-color="#70a5fd" stop-opacity="0.12"/>
    <stop offset="100%" stop-color="#70a5fd" stop-opacity="0.0"/>
  </linearGradient>
  <linearGradient id="wave5g" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%"   stop-color="#bf91f3" stop-opacity="0.0"/>
    <stop offset="50%"  stop-color="#bf91f3" stop-opacity="0.10"/>
    <stop offset="100%" stop-color="#bf91f3" stop-opacity="0.0"/>
  </linearGradient>

  <linearGradient id="nameGlow" x1="0%" y1="0%" x2="0%" y2="100%">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="100%" stop-color="#c9d1d9"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="3" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- background -->
<rect width="900" height="240" fill="url(#bg)"/>

<!-- wave 1 -->
<path fill="url(#wave1g)">
  <animate attributeName="d" dur="9s" repeatCount="indefinite"
    values="
      M0,240 C0,132 60,118 120,124 C180,130 210,106 270,112 C330,118 360,100 420,108 C480,116 510,102 570,110 C630,118 660,104 720,112 C780,120 840,108 900,116 L900,240 Z;
      M0,240 C0,122 60,112 120,118 C180,124 210,140 270,132 C330,124 360,116 420,122 C480,128 510,114 570,120 C630,126 660,112 720,120 C780,128 840,116 900,122 L900,240 Z;
      M0,240 C0,132 60,118 120,124 C180,130 210,106 270,112 C330,118 360,100 420,108 C480,116 510,102 570,110 C630,118 660,104 720,112 C780,120 840,108 900,116 L900,240 Z
    "/>
</path>

<!-- wave 2 -->
<path fill="url(#wave2g)">
  <animate attributeName="d" dur="11s" repeatCount="indefinite"
    values="
      M0,240 C0,148 50,138 120,144 C190,150 230,134 300,140 C370,146 400,130 460,138 C520,146 560,132 630,140 C700,148 760,136 840,142 C870,145 890,140 900,142 L900,240 Z;
      M0,240 C0,158 50,144 120,150 C190,156 230,142 300,148 C370,154 400,140 460,146 C520,152 560,138 630,146 C700,154 760,142 840,148 C870,151 890,146 900,148 L900,240 Z;
      M0,240 C0,148 50,138 120,144 C190,150 230,134 300,140 C370,146 400,130 460,138 C520,146 560,132 630,140 C700,148 760,136 840,142 C870,145 890,140 900,142 L900,240 Z
    "/>
</path>

<!-- wave 3 -->
<path fill="url(#wave3g)">
  <animate attributeName="d" dur="13s" repeatCount="indefinite"
    values="
      M0,240 C0,166 70,156 150,162 C230,168 260,152 340,158 C420,164 450,150 530,156 C610,162 650,150 730,156 C810,162 860,154 900,158 L900,240 Z;
      M0,240 C0,174 70,162 150,168 C230,174 260,160 340,166 C420,172 450,158 530,164 C610,170 650,158 730,164 C810,170 860,162 900,166 L900,240 Z;
      M0,240 C0,166 70,156 150,162 C230,168 260,152 340,158 C420,164 450,150 530,156 C610,162 650,150 730,156 C810,162 860,154 900,158 L900,240 Z
    "/>
</path>

<!-- wave 4 -->
<path fill="url(#wave4g)">
  <animate attributeName="d" dur="16s" repeatCount="indefinite"
    values="
      M0,240 C0,184 80,176 160,180 C240,184 280,174 360,178 C440,182 480,172 560,176 C640,180 700,172 780,178 C840,182 880,176 900,178 L900,240 Z;
      M0,240 C0,190 80,182 160,186 C240,190 280,180 360,184 C440,188 480,178 560,182 C640,186 700,178 780,184 C840,188 880,182 900,184 L900,240 Z;
      M0,240 C0,184 80,176 160,180 C240,184 280,174 360,178 C440,182 480,172 560,176 C640,180 700,172 780,178 C840,182 880,176 900,178 L900,240 Z
    "/>
</path>

<!-- wave 5 -->
<path fill="url(#wave5g)">
  <animate attributeName="d" dur="20s" repeatCount="indefinite"
    values="
      M0,240 C0,202 100,196 200,200 C300,204 350,196 450,200 C550,204 600,196 700,200 C800,204 860,198 900,200 L900,240 Z;
      M0,240 C0,208 100,202 200,206 C300,210 350,202 450,206 C550,210 600,202 700,206 C800,210 860,204 900,206 L900,240 Z;
      M0,240 C0,202 100,196 200,200 C300,204 350,196 450,200 C550,204 600,196 700,200 C800,204 860,198 900,200 L900,240 Z
    "/>
</path>

<!-- star particles -->
<g fill="#c8d3ff">
  <circle cx="55"  cy="30"  r="1.4"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="130" cy="55"  r="1.1"><animate attributeName="opacity" values="0.2;0.4;0.2"  dur="4.2s" repeatCount="indefinite"/></circle>
  <circle cx="210" cy="22"  r="1.6"><animate attributeName="opacity" values="0.1;0.3;0.1"  dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="310" cy="48"  r="1.0"><animate attributeName="opacity" values="0.2;0.45;0.2" dur="5.0s" repeatCount="indefinite"/></circle>
  <circle cx="430" cy="18"  r="1.5"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="540" cy="52"  r="1.2"><animate attributeName="opacity" values="0.15;0.4;0.15" dur="4.4s" repeatCount="indefinite"/></circle>
  <circle cx="615" cy="28"  r="1.3"><animate attributeName="opacity" values="0.1;0.3;0.1"  dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="720" cy="42"  r="1.1"><animate attributeName="opacity" values="0.2;0.4;0.2"  dur="3.9s" repeatCount="indefinite"/></circle>
  <circle cx="820" cy="20"  r="1.4"><animate attributeName="opacity" values="0.1;0.35;0.1" dur="4.7s" repeatCount="indefinite"/></circle>
  <circle cx="870" cy="58"  r="1.0"><animate attributeName="opacity" values="0.15;0.35;0.15" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="85"  cy="110" r="1.0"><animate attributeName="opacity" values="0.1;0.28;0.1" dur="5.2s" repeatCount="indefinite"/></circle>
  <circle cx="175" cy="92"  r="1.4"><animate attributeName="opacity" values="0.2;0.38;0.2" dur="3.7s" repeatCount="indefinite"/></circle>
  <circle cx="270" cy="118" r="1.1"><animate attributeName="opacity" values="0.1;0.3;0.1"  dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="390" cy="100" r="1.6"><animate attributeName="opacity" values="0.15;0.4;0.15" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="760" cy="85"  r="1.2"><animate attributeName="opacity" values="0.1;0.32;0.1" dur="4.8s" repeatCount="indefinite"/></circle>
</g>

<!-- NAME — fades up -->
<text x="450" y="84" text-anchor="middle"
  font-family="'Fira Code', monospace" font-size="38" font-weight="700"
  fill="url(#nameGlow)" filter="url(#glow)" letter-spacing="2"
  opacity="0">
  Sai Shashank M
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.08;0.2" dur="6s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0,10;0,10;0,0" keyTimes="0;0.08;0.2" dur="6s" fill="freeze"/>
</text>

<!-- TAGLINE — types in via clipPath trick using rect grow -->
<text x="450" y="112" text-anchor="middle"
  font-family="'Fira Code', monospace" font-size="12" letter-spacing="3"
  fill="#38bdae" opacity="0">
  UAV ENGINEER · EMBEDDED SYSTEMS · AI · FULL-STACK
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.22;0.30" dur="6s" fill="freeze"/>
</text>

<!-- blinking cursor after tagline -->
<rect x="680" y="100" width="2" height="14" fill="#38bdae" opacity="0" rx="1">
  <animate attributeName="opacity" values="0;0;1;0;1;0;1;0;1;0;0" keyTimes="0;0.30;0.38;0.46;0.54;0.62;0.70;0.78;0.86;0.94;1" dur="6s" fill="freeze"/>
</rect>

<!-- ROLE CHIPS — pop in one by one -->
<!-- chip 1: Daloft Aerospace -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.55;0.62" dur="8s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0,8;0,8;0,0" keyTimes="0;0.55;0.62" dur="8s" fill="freeze"/>
  <rect x="154" y="124" width="134" height="22" rx="11" fill="rgba(112,165,253,0.12)" stroke="#70a5fd" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="221" y="139" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#70a5fd" letter-spacing="0.3">Daloft Aerospace</text>
</g>

<!-- chip 2: DRDO Researcher -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.62;0.69" dur="8s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0,8;0,8;0,0" keyTimes="0;0.62;0.69" dur="8s" fill="freeze"/>
  <rect x="298" y="124" width="134" height="22" rx="11" fill="rgba(191,145,243,0.12)" stroke="#bf91f3" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="365" y="139" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#bf91f3" letter-spacing="0.3">DRDO Researcher</text>
</g>

<!-- chip 3: AIR 1 DDC 26 -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.69;0.76" dur="8s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0,8;0,8;0,0" keyTimes="0;0.69;0.76" dur="8s" fill="freeze"/>
  <rect x="442" y="124" width="106" height="22" rx="11" fill="rgba(56,189,174,0.12)" stroke="#38bdae" stroke-width="0.8" stroke-opacity="0.5"/>
  <text x="495" y="139" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#38bdae" letter-spacing="0.3">AIR 1 DDC'26</text>
</g>

<!-- chip 4: 3 Papers 1 Patent -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.76;0.83" dur="8s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0,8;0,8;0,0" keyTimes="0;0.76;0.83" dur="8s" fill="freeze"/>
  <rect x="558" y="124" width="134" height="22" rx="11" fill="rgba(255,183,77,0.10)" stroke="#ffb74d" stroke-width="0.8" stroke-opacity="0.4"/>
  <text x="625" y="139" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#ffb74d" letter-spacing="0.3">3 Papers · 1 Patent</text>
</g>

<!-- SOCIAL LINKS — bounce up staggered -->
<!-- LinkedIn -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.72;0.80" dur="10s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0,12;0,12;0,0" keyTimes="0;0.72;0.80" dur="10s" fill="freeze"/>
  <rect x="222" y="168" width="96" height="24" rx="12" fill="rgba(0,119,181,0.15)" stroke="#0077b5" stroke-width="0.8"/>
  <circle cx="237" cy="180" r="3.5" fill="#0077b5"/>
  <text x="268" y="184" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#58a6ff" letter-spacing="0.4">LinkedIn</text>
</g>

<!-- GitHub -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.79;0.87" dur="10s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0,12;0,12;0,0" keyTimes="0;0.79;0.87" dur="10s" fill="freeze"/>
  <rect x="332" y="168" width="96" height="24" rx="12" fill="rgba(255,255,255,0.05)" stroke="#30363d" stroke-width="0.8"/>
  <circle cx="347" cy="180" r="3.5" fill="#6e7681"/>
  <text x="378" y="184" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#c9d1d9" letter-spacing="0.4">GitHub</text>
</g>

<!-- Email -->
<g opacity="0">
  <animate attributeName="opacity" values="0;0;1" keyTimes="0;0.86;0.94" dur="10s" fill="freeze"/>
  <animateTransform attributeName="transform" type="translate" values="0,12;0,12;0,0" keyTimes="0;0.86;0.94" dur="10s" fill="freeze"/>
  <rect x="442" y="168" width="96" height="24" rx="12" fill="rgba(209,72,54,0.12)" stroke="#d14836" stroke-width="0.8"/>
  <circle cx="457" cy="180" r="3.5" fill="#d14836"/>
  <text x="488" y="184" text-anchor="middle" font-family="'Fira Code', monospace" font-size="10" fill="#ff7b6e" letter-spacing="0.4">Email</text>
</g>

</svg>
